services:
  mock-target:
    environment:
      AGENTBRAKE_INJECTION_FIXTURE: "1"
  verifier:
    volumes:
      - ${RUN_DIR}/target-token:/run/secrets/target-token:ro
      - ${RUN_DIR}/codex-credential.json:/run/codex-credential.json
  local-model:
    image: ${OLLAMA_IMAGE:?Pinned local model runtime required}
    profiles: [codex-verification]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    gpus: all
    mem_limit: 12g
    pids_limit: 256
    networks: [inference]
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${MODEL_DIR}:/models:ro
    tmpfs: ["/tmp:size=256m,mode=1777"]
    command: [serve]
  codex-agent:
    image: ${COMPOSE_PROJECT_NAME}-codex
    profiles: [codex-verification]
    build:
      context: ../..
      dockerfile: infra/local/Codex.Dockerfile
      args:
        RUNTIME_IMAGE: ${COMPOSE_PROJECT_NAME}-runtime
        CODEX_VERSION: ${CODEX_VERSION}
    user: "1000:1000"
    group_add: ["${FIXTURE_GID:-1000}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    networks: [agent, inference]
    volumes:
      - ${RUN_DIR}/codex-credential.json:/run/agent-credential.json:ro
    tmpfs: ["/tmp:size=256m,mode=1777"]
    command: [node, -e, "setInterval(()=>{},60000)"]
networks:
  inference:
    internal: true
    labels: { com.agentbrake.fixture: "true" }
